services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: ngrimbi-app

    restart: unless-stopped

    working_dir: /var/www

    volumes:
      - ./:/var/www
      - app_vendor:/var/www/vendor
      - app_node_modules:/var/www/node_modules

    depends_on:
      - mysql

    networks:
      - ngrimbi


  nginx:

    image: nginx:latest

    container_name: ngrimbi-nginx

    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - ./:/var/www

      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    networks:
      - ngrimbi


  mysql:

    image: mysql:8.0

    container_name: ngrimbi-mysql

    restart: unless-stopped

    environment:

      MYSQL_DATABASE: ${DB_DATABASE:-ngrimbi}

      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}

      MYSQL_USER: ${DB_USERNAME:-ngrimbi}

      MYSQL_PASSWORD: ${DB_PASSWORD:-password}

    volumes:

      - mysql_data:/var/lib/mysql

    ports:

      - "127.0.0.1:3306:3306"

    networks:

      - ngrimbi


volumes:

  mysql_data:
  app_vendor:
  app_node_modules:


networks:

  ngrimbi:

    driver: bridge
